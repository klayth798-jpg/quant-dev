services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantdev
      POSTGRES_USER: quantdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantdev-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdev -d quantdev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-quantdev-local}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-quantdev-local}
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "quantdev.cli", "migrate"]
    environment: &app-environment
      QUANTDEV_ENV: development
      QUANTDEV_DATA_MODE: ${QUANTDEV_DATA_MODE:-demo}
      QUANTDEV_DATABASE_BACKEND: postgresql
      QUANTDEV_DATABASE_URL: postgresql://quantdev:${POSTGRES_PASSWORD:-quantdev-local}@postgres:5432/quantdev
      QUANTDEV_TASK_BACKEND: redis
      QUANTDEV_REDIS_URL: redis://:${REDIS_PASSWORD:-quantdev-local}@redis:6379/0
      MARKET_DATA_SDK: ${MARKET_DATA_SDK:-tushare}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TINYSHARE_TOKEN: ${TINYSHARE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "quantdev.cli", "worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  paper-runner:
    build:
      context: .
      dockerfile: infra/Dockerfile
    profiles: ["paper-live"]
    command: ["python", "-m", "quantdev.cli", "paper-runner"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
